# Example: 4-DOF fold module (YAML key must match module_key: torso).
# Protocol: profile position mode only (no MIT / torque_limit).

torso:
  can_channel: can0
  profile_vel: 3.0
  profile_accel: 5.0
  profile_decel: 5.0
  joints:
    - joint_name: torso_joint1
      node_id: 1
      polarity: 1.0
      lower_limit: -1.57
      upper_limit: 1.396
      torque_b: 84.0

    - joint_name: torso_joint2
      node_id: 2
      polarity: 1.0
      lower_limit: 0.0
      upper_limit: 2.75
      torque_b: 84.0

    - joint_name: torso_joint3
      node_id: 3
      polarity: 1.0
      lower_limit: -1.5
      upper_limit: 1.75
      torque_b: 50.0

    - joint_name: torso_joint4
      node_id: 4
      polarity: 1.0
      lower_limit: -1.57
      upper_limit: 1.57
      torque_b: 30.0
